services:
  # Node.js/Express Backend (Exp 7 & 9)
  backend:
    build: ./backend
    container_name: vesource-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/vesource}
      - JWT_SECRET=${JWT_SECRET:-vesource_jwt_secret_key_2026}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  # React Frontend served by Nginx (Exp 7 & 9)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vesource-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Local MongoDB service with healthcheck (Exp 9)
  mongo:
    image: mongo:7.0
    container_name: vesource-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/test --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongo-data:
